<style>

  --warn: #ED6D37;
  --warn-ink: #1e1e1e;

html, body { height: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: "Atkinson Hyperlegible Next", "Atkinson Hyperlegible", -apple-system, system-ui, "Helvetica Neue", sans-serif;
  font-size: 17px;
  line-height: 1.45;
  -webkit-text-size-adjust: 100%;
}
* { box-sizing: border-box; }
button { font: inherit; color: inherit; }
code { font-family: "Source Code Pro", ui-monospace, Menlo, monospace; font-size: 0.92em; color: var(--code); }
mark { background: var(--mark); color: inherit; padding: 0 0.15em; }
a { color: var(--accent); }
.num { font-variant-numeric: tabular-nums; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

/* header */
#hdr {
  position: sticky;
  top: env(safe-area-inset-top, 0px);
  z-index: 5;
  background: var(--card);
  border-bottom: 2px solid var(--line);
  padding: 10px 16px 8px;
  display: grid;
  grid-template-columns: auto 1fr auto;
  gap: 8px 20px;
  align-items: center;
}
#hdr.over { border-bottom-color: var(--warn); }
#clock { font-size: 40px; font-weight: 700; line-height: 1; }
#clock small { display: block; font-size: 13px; font-weight: 400; color: var(--muted); letter-spacing: 0.04em; text-transform: uppercase; margin-top: 4px; }
.hdr-main { min-width: 0; }
#hdrTitle { font-weight: 700; font-size: 19px; color: var(--accent); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.hdr-nums { display: flex; gap: 28px; align-items: baseline; flex-wrap: wrap; }
.hdr-nums .big { font-size: 64px; font-weight: 700; line-height: 1; letter-spacing: -0.01em; }
.hdr-nums .lbl { font-size: 13px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em; display: block; margin-bottom: 2px; }
.hdr-nums .big.over { color: var(--warn); }
.hdr-nums .big.soon { color: var(--warn); }
#drift { font-size: 20px; color: var(--muted); margin-top: 2px; }
#drift.behind { color: var(--warn); }
.hdr-right { display: flex; flex-direction: column; gap: 6px; align-items: flex-end; font-size: 13px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em; }
.hdr-right .pill { border: 1px solid var(--line); border-radius: 999px; padding: 3px 10px; white-space: nowrap; }
.hdr-right .pill.on { border-color: var(--accent); color: var(--accent); }

/* tabs */
nav.tabs { display: flex; gap: 4px; padding: 10px 16px 0; overflow-x: auto; }
nav.tabs button {
  border: 0; background: transparent; padding: 10px 16px; border-radius: 10px 10px 0 0;
  font-size: 17px; font-weight: 600; color: var(--muted); white-space: nowrap;
}
nav.tabs button[aria-selected="true"] { background: var(--card); color: var(--accent); box-shadow: inset 0 -3px 0 var(--accent); }
.wrap { padding-inline: 16px; padding-block: 12px 40px; }
.tab[hidden] { display: none !important; }

/* day layout */
.day { display: grid; grid-template-columns: 380px minmax(0, 1fr); gap: 16px; align-items: start; }
#blocks { background: var(--card); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
.blk {
  display: grid; grid-template-columns: 96px 1fr; gap: 2px 12px; align-items: center;
  width: 100%; text-align: left; border: 0; border-left: 6px solid transparent; border-bottom: 1px solid var(--line);
  background: transparent; padding: 10px 12px 10px 10px; cursor: pointer;
}
.blk:last-child { border-bottom: 0; }
.blk .when { font-size: 15px; color: var(--muted); }
.blk .t { font-size: 17px; font-weight: 600; line-height: 1.25; }
.blk .sub { grid-column: 2; font-size: 14px; color: var(--muted); }
.blk.running { border-left-color: var(--accent); background: var(--run); }
.blk.next { background: var(--next); border-left-color: var(--next); }
.blk.done .t { color: var(--done); font-weight: 400; }
.blk.done .when { text-decoration: line-through; }
.blk.open { outline: 2px solid var(--accent); outline-offset: -2px; }
.blk .tag { display: inline-block; font-size: 11px; text-transform: uppercase; letter-spacing: 0.05em; border: 1px solid var(--warn); color: var(--warn); border-radius: 999px; padding: 1px 7px; margin-left: 6px; vertical-align: middle; }

#panel { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 16px 18px 20px; min-width: 0; }
.panel-head { display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: baseline; justify-content: space-between; }
.panel-head h2 { margin: 0; font-size: 26px; line-height: 1.2; color: var(--accent); text-wrap: balance; }
.panel-head .when { font-size: 17px; color: var(--muted); white-space: nowrap; }
.actions { display: flex; flex-wrap: wrap; gap: 10px; margin: 14px 0 6px; }
.btn {
  border: 2px solid var(--accent); background: var(--accent); color: var(--accent-ink);
  border-radius: 12px; padding: 0 22px; min-height: 56px; font-size: 19px; font-weight: 700; cursor: pointer;
}
.btn.secondary { background: transparent; color: var(--accent); }
.btn.quiet { background: transparent; color: var(--muted); border-color: var(--line); font-weight: 600; }
.btn.armed { background: var(--warn); border-color: var(--warn); color: var(--warn-ink); }
.btn:disabled { opacity: 0.45; cursor: default; }
.listbtn { display: none; }
.intro { color: var(--muted); font-size: 16px; margin: 10px 0 0; }
.slides { font-size: 14px; color: var(--muted); margin: 8px 0 0; }
.question { margin: 14px 0 0; padding: 12px 16px; border-left: 6px solid var(--accent); background: var(--run); border-radius: 0 10px 10px 0; font-size: 19px; }
.question small { display: block; font-size: 14px; color: var(--muted); margin-top: 4px; }
.sum { font-size: 14px; color: var(--muted); margin: 16px 0 4px; display: flex; justify-content: space-between; }

/* rows */
.rows { list-style: none; margin: 0; padding: 0; }
.row { border-top: 1px solid var(--line); }
.row-line { display: grid; grid-template-columns: 44px 52px minmax(0, 1fr); align-items: center; min-height: 56px; gap: 8px; }
.tick {
  width: 40px; height: 40px; border-radius: 10px; border: 2px solid var(--line); background: transparent; cursor: pointer;
  display: grid; place-items: center; font-size: 22px; line-height: 1; color: transparent;
}
.tick[aria-pressed="true"] { background: var(--tick); border-color: var(--tick); color: var(--accent-ink); }
.row .min { font-size: 15px; color: var(--muted); text-align: right; padding-right: 4px; }
.row .label { text-align: left; border: 0; background: transparent; padding: 10px 0; font-size: 22px; line-height: 1.3; display: flex; justify-content: space-between; gap: 10px; align-items: center; cursor: pointer; }
.row .label.static { cursor: default; }
.row .label .chev { font-size: 22px; color: var(--muted); transition: transform 0.15s; flex: none; }
.row.expanded .label .chev { transform: rotate(90deg); }
.row.done .label { color: var(--done); text-decoration: line-through; text-decoration-thickness: 1px; }
.notes { padding: 4px 0 14px 44px; font-size: 19px; }
.notes[hidden] { display: none !important; }
.sec { margin: 8px 0 14px; }

.sec h3 .pill { font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; border: 1px solid var(--line); color: var(--muted); border-radius: 999px; padding: 1px 8px; }
.sec h3 .pill.warn { border-color: var(--warn); color: var(--warn); }
.sec p { margin: 6px 0; }
.sec ul, .sec ol { margin: 6px 0; padding-left: 26px; }
.sec li { margin: 4px 0; }
.sec ol.steps { list-style: none; padding-left: 0; }
.sec ol.steps > li { display: grid; grid-template-columns: 40px 34px minmax(0, 1fr) auto; gap: 8px; align-items: start; padding: 6px 0; border-top: 1px dashed var(--line); }
.sec ol.steps > li .n { color: var(--muted); font-variant-numeric: tabular-nums; padding-top: 6px; }
.sec ol.steps > li .txt { padding-top: 6px; }
.sec ol.steps > li .smin { font-size: 14px; color: var(--muted); padding-top: 8px; white-space: nowrap; }
.sec ol.steps > li.done .txt { color: var(--done); text-decoration: line-through; }
.sec .more { font-size: 14px; text-transform: uppercase; letter-spacing: 0.05em; color: var(--muted); margin: 18px 0 4px; }

/* lists on the other tabs */
.checks { list-style: none; margin: 0; padding: 0; background: var(--card); border: 1px solid var(--line); border-radius: 12px; }
.checks li { display: grid; grid-template-columns: 44px minmax(0, 1fr); gap: 10px; align-items: start; padding: 10px 14px; border-top: 1px solid var(--line); font-size: 19px; }
.checks li:first-child { border-top: 0; }
.checks li .tick { margin-top: 2px; }
.checks li.done .txt { color: var(--done); text-decoration: line-through; }
.plain { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 12px 18px 12px 34px; font-size: 17px; }
.plain li { margin: 6px 0; }
h2.tabh { font-size: 22px; color: var(--accent); margin: 16px 0 8px; }
h2.tabh:first-child { margin-top: 4px; }
.stamp { font-size: 14px; color: var(--muted); margin-top: 16px; }

/* log */
table.log { width: 100%; border-collapse: collapse; background: var(--card); border: 1px solid var(--line); border-radius: 12px; font-size: 15px; }
table.log th, table.log td { text-align: left; padding: 8px 10px; border-top: 1px solid var(--line); vertical-align: top; }
table.log th { color: var(--muted); font-weight: 600; font-size: 13px; text-transform: uppercase; letter-spacing: 0.05em; border-top: 0; }
table.log td.n { text-align: right; }
table.log td.behind { color: var(--warn); }
.logwrap { overflow-x: auto; }
textarea#exportbox { width: 100%; min-height: 160px; font-family: "Source Code Pro", ui-monospace, Menlo, monospace; font-size: 13px; margin-top: 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--card); color: var(--ink); padding: 8px; }
.banner { background: var(--next); border-radius: 10px; padding: 10px 14px; font-size: 15px; margin-bottom: 12px; }

@media (max-width: 900px) {
  .day { grid-template-columns: 1fr; }
  #blocks { display: none; }
  body.show-list #blocks { display: block; }
  .listbtn { display: inline-flex; align-items: center; }
  #hdr { grid-template-columns: auto 1fr; }
  .hdr-right { grid-column: 1 / -1; flex-direction: row; justify-content: flex-start; }
  .hdr-nums .big { font-size: 52px; }
  #clock { font-size: 32px; }
  .row .label { font-size: 20px; }
}
@media (max-width: 480px) {
  .hdr-nums { gap: 16px; }
  .hdr-nums .big { font-size: 40px; }
  #drift { font-size: 16px; }
  .row-line { grid-template-columns: 44px 40px minmax(0, 1fr); }
  .notes { padding-left: 0; }
}
@media (prefers-reduced-motion: reduce) {
  .row .label .chev { transition: none; }
}

</style>

ml":"Rule two: commit often. A commit is a checkpoint you can return to and a line in the record. A pull request is for the end of a larger chunk of work. Today: a commit after every run that changed a file, one pull request per sprint.","text":"Rule two: commit often. A commit is a checkpoint you can return to and a line in the record. A pull request is for the end of a larger chunk of work. Today: a commit after every run that changed a file, one pull request per sprint.","children":[]}]}]},{"id":"s1","title":"Spectrum line","min":8,"countdown":null,"tags":[],"content":[{"t":"ul","items":[{"html":"Tape line along the room. Stand by agent experience (never, to weekly). Two voices from each end.","text":"Tape line along the room. Stand by agent experience (never, to weekly). Two voices from each end.","children":[]},{"html":"Re-sort by \"how much do I trust the output\". Two voices again. Sit down.","text":"Re-sort by \"how much do I trust the output\". Two voices again. Sit down.","children":[]}]}]},{"id":"s2","title":"Four questions","min":6,"countdown":null,"tags":[],"content":[{"t":"ul","items":[{"html":"One slide, four questions: what must never go in; how do I know this is right; could I recreate it if the AI were gone; what do I say, and to whom.","text":"One slide, four questions: what must never go in; how do I know this is right; could I recreate it if the AI were gone; what do I say, and to whom.","children":[]},{"html":"Two neighbour minutes (countdown 2): pick the question that worries you most and say why. The background pages carry the arguments; the slide carries the questions.","text":"Two neighbour minutes (countdown 2): pick the question that worries you most and say why. The background pages carry the arguments; the slide carries the questions.","children":[]}]}]},{"id":"s3","title":"How the day works, the variable, two rungs","min":6,"countdown":null,"tags":[],"content":[{"t":"ul","items":[{"html":"The same path twice, a studio inside the first run. The variable table with its six rows: who reads the files, who decides the steps, who reviews, where the instructions live, and where the result lives. Point at the last column: a chat thread in an account against files and a commit in a repository. Sprint 1 is rows 1 and 2, sprint 2 is rows 3 to 5.","text":"The same path twice, a studio inside the first run. The variable table with its six rows: who reads the files, who decides the steps, who reviews, where the instructions live, and where the result lives. Point at the last column: a chat thread in an account against files and a commit in a repository. Sprint 1 is rows 1 and 2, sprint 2 is rows 3 to 5.","children":[]},{"html":"Two rungs today: the stakes ladder in its compact form. The workflow is not the same for every task; which rung a task gets is the first decision. Sprint 1 is rung 1, sprint 2 is rung 3. The physical version is on the floor at 13:02.","text":"Two rungs today: the stakes ladder in its compact form. The workflow is not the same for every task; which rung a task gets is the first decision. Sprint 1 is rung 1, sprint 2 is rung 3. The physical version is on the floor at 13:02.","children":[]}]}]},{"id":"s4","title":"Objectives and schedule","min":5,"countdown":null,"tags":[],"content":[{"t":"ul","items":[{"html":"Objectives (four, keyword-led). Schedule: point at the two ships, the two snack breaks, the walk, the zine.","text":"Objectives (four, keyword-led). Schedule: point at the two ships, the two snack breaks, the walk, the zine.","children":[]}]}]},{"id":"s5","title":"Your turn: question bank","min":10,"countdown":8,"tags":[],"content":[{"t":"ul","items":[{"html":"On the printed question sheet, three questions your data can answer: (1) one you already know the answer to, to check it; (2) one you do not, to explore; (3) one the data cannot answer, to catch it. One sentence each.","text":"On the printed question sheet, three questions your data can answer: (1) one you already know the answer to, to check it; (2) one you do not, to explore; (3) one the data cannot answer, to catch it. One sentence each.","children":[]},{"html":"Swap with a neighbour, who makes question 1 20 percent more specific: which column, which unit, which comparison. The sharper version goes in box 4.","text":"Swap with a neighbour, who makes question 1 20 percent more specific: which column, which unit, which comparison. The sharper version goes in box 4.","children":[]},{"html":"Pin the sheet on the wall.","text":"Pin the sheet on the wall.","children":[]},{"html":"Then the instructor's questions on the slide: which of the 47 FSTPs meet the CPCB discharge standard of 30 mg/L BOD, and how does BOD removal compare across treatment technologies (question 1); helminth egg counts in the treated effluent (question 3, the one the report cannot answer).","text":"Then the instructor's questions on the slide: which of the 47 FSTPs meet the CPCB discharge standard of 30 mg/L BOD, and how does BOD removal compare across treatment technologies (question 1); helminth egg counts in the treated effluent (question 3, the one the report cannot answer).","children":[]}]}]}],"orphanSections":[],"breakQuestion":null},{"id":"b0940","title":"Current state, safety rails, the commit rule","start":"09:40","end":"10:15","min":35,"tags":[],"startIso":"2026-09-29T09:40:00+02:00","endIso":"2026-09-29T10:15:00+02:00","slides":["Round 0 (variable)","The steps of a paper","Round 1 (variable)","My turn (chat)","Where did that go?","A good question","Our turn (safety rails)","Four keys","Our turn (one commit by hand)","Who commits?","Our turn (two skills)","Snack break"],"intro":["Slides labelled \"current state\" for rounds 0 and 1, then the rails.","The helper lays out the snacks during the chat demo."],"rows":[{"id":"b0940/r0","min":3,"label":"Rounds 0 and 1 slides, the workflow graph, neighbour minute","html":"Rounds 0 and 1 slides, the workflow graph, neighbour minute","sections":["s0"]},{"id":"b0940/r1","min":6,"label":"My turn: chat","html":"My turn: chat","sections":["s1"]},{"id":"b0940/r2","min":2,"label":"Where did that go?","html":"Where did that go?","sections":["s2"]},{"id":"b0940/r3","min":2,"label":"A good question","html":"A good question","sections":["s3"]},{"id":"b0940/r4","min":8,"label":"Our turn: safety rails, Shift+Tab follow along","html":"Our turn: safety rails, Shift+Tab follow along","sections":["s4"]},{"id":"b0940/r5","min":1,"label":"Four keys","html":"Four keys","sections":["s5"]},{"id":"b0940/r6","min":4,"label":"Our turn: one commit by hand","html":"Our turn: one commit by hand","sections":["s6"]},{"id":"b0940/r7","min":3,"label":"Who commits, and how often","html":"Who commits, and how often","sections":["s7"]},{"id":"b0940/r8","min":5,"label":"Our turn: install the two skills","html":"Our turn: install the two skills","sections":["s8"]},{"id":"b0940/r9","min":1,"label":"Buffer, break slide","html":"Buffer, break slide","sections":[]}],"sections":[{"id":"s0","title":"Rounds 0 and 1","min":3,"countdown":null,"tags":[],"content":[{"t":"ul","items":[{"html":"The steps of a paper as you do them now: the workflow graph from the colloquium talk. Point at the five boxes the day touches: data processing, data analysis, the manuscript, the repository, the release.","text":"The steps of a paper as you do them now: the workflow graph from the colloquium talk. Point at the five boxes the day touches: data processing, data analysis, the manuscript, the repository, the release.","children":[]},{"html":"Neighbour minute (countdown 1): where does AI sit in your workflow today, if anywhere?","text":"Neighbour minute (countdown 1): where does AI sit in your workflow today, if anywhere?","children":[]}]}]},{"id":"s1","title":"My turn: round 1, chat","min":6,"countdown":null,"tags":["DEMO SCRIPT"],"content":[{"t":"p","html":"Browser, claude.ai chat, the report PDF from <code>~/Documents/gitrepos/gh-org-agentsforsci-ghe/fstp-eval-india/data/<\/code>. The three steps are on the slide so the room can follow."},{"t":"ol","items":[{"html":"Upload the report, ask question 1. Show the answer and ask for receipts: which page, which table.","text":"Upload the report, ask question 1. Show the answer and ask for receipts: which page, which table.","children":[],"n":1,"min":3,"id":"b0940/s1/i0"},{"html":"Question 3: \"What are the helminth egg counts in the treated effluent per plant?\" The report's tables carry pH, TS, TDS, TSS, COD, BOD, TKN, ammoniacal nitrogen, total phosphate and faecal coliform, not helminth eggs. Confirmed in rehearsal: <mark>note what the model did<\/mark>.","text":"Question 3: \"What are the helminth egg counts in the treated effluent per plant?\" The report's tables carry pH, TS, TDS, TSS, COD, BOD, TKN, ammoniacal nitrogen, total phosphate and faecal coliform, not helminth eggs. Confirmed in rehearsal: [note what the model did].","children":[],"n":2,"min":2,"id":"b0940/s1/i1"},{"html":"Name it: the answer sounds the same whether it is right or not. That is why question 3 is on your sheet, and why card 2 exists.","text":"Name it: the answer sounds the same whether it is right or not. That is why question 3 is on your sheet, and why card 2 exists.","children":[],"n":3,"min":1,"id":"b0940/s1/i2"}]}]},{"id":"s2","title":"Where did that go?","min":2,"countdown":null,"tags":[],"content":[{"t":"ul","items":[{"html":"One slide, one table: the PDF is on Anthropic's servers in my account, the answer is in a chat thread, to continue tomorrow I scroll and paste, to share it I send a screenshot, to redo it I ask again and get a different answer. Nothing is in the project, nothing is versioned, nobody can check it. This is the last column of the variable table; everything after the break puts the result where a colleague can read it.","text":"One slide, one table: the PDF is on Anthropic's servers in my account, the answer is in a chat thread, to continue tomorrow I scroll and paste, to share it I send a screenshot, to redo it I ask again and get a different answer. Nothing is in the project, nothing is versioned, nobody can check it. This is the last column of the variable table; everything after the break puts the result where a colleague can read it.","children":[]}]}]},{"id":"s3","title":"A good question","min":2,"countdown":null,"tags":[],"content":[{"t":"ul","items":[{"html":"One slide, one sourced line: being 20 percent more specific improves the result by 80 percent (Wickham and Bryan, Modern R Workflow, posit::conf 2026). Point back at the neighbour edit of question 1.","text":"One slide, one sourced line: being 20 percent more specific improves the result by 80 percent (Wickham and Bryan, Modern R Workflow, posit::conf 2026). Point back at the neighbour edit of question 1.","children":[]}]}]},{"id":"s4","title":"Our turn: safety rails","min":8,"countdown":null,"tags":[],"content":[{"t":"ul","items":[{"html":"Together, step by step: open <code>data/<\/code> in your own repository and look once more against the group rule; terminal at <code>~/Documents/gitrepos/gh-org-agentsforsci-ghe/&lt;your repo&gt;<\/code>, not one level up (the agent reads the folder it starts in); <code>git switch -c dev<\/code> (anyone who already has a <code>dev<\/code> branch: <code>git switch dev<\/code>); <code>claude<\/code>.","text":"Together, step by step: open data/ in your own repository and look once more against the group rule; terminal at ~/Documents/gitrepos/gh-org-agentsforsci-ghe/<your repo>, not one level up (the agent reads the folder it starts in); git switch -c dev (anyone who already has a dev branch: git switch dev); claude.","children":[]},{"html":"Step 4 is a follow along. I press Shift+Tab on the projector, everyone presses on their own screen, until the line under the box says \"auto mode on\". The cycle is auto, manual, accept edits, plan, auto. On the Team plan auto is the starting mode, so most screens say it already; the point is that everyone has pressed the key once. Then <code>/context<\/code>.","text":"Step 4 is a follow along. I press Shift+Tab on the projector, everyone presses on their own screen, until the line under the box says \"auto mode on\". The cycle is auto, manual, accept edits, plan, auto. On the Team plan auto is the starting mode, so most screens say it already; the point is that everyone has pressed the key once. Then /context.","children":[]},{"html":"Sticky note when <code>/context<\/code> has printed and the line says auto mode on.","text":"Sticky note when /context has printed and the line says auto mode on.","children":[]}]}]},{"id":"s5","title":"Four keys","min":1,"countdown":null,"tags":[],"content":[{"t":"ul","items":[{"html":"Shift+Tab cycles the mode. Esc stops a run. Esc twice on an empty box lists earlier turns to go back to. Up arrow brings back the last prompt. A screenshot pastes into the box with Ctrl+V (Cmd+V in iTerm2). Checked against the Claude Code docs on 24 September; drag and drop is on the rehearsal list.","text":"Shift+Tab cycles the mode. Esc stops a run. Esc twice on an empty box lists earlier turns to go back to. Up arrow brings back the last prompt. A screenshot pastes into the box with Ctrl+V (Cmd+V in iTerm2). Checked against the Claude Code docs on 24 September; drag and drop is on the rehearsal list.","children":[]}]}]},{"id":"s6","title":"Our turn: one commit by hand","min":4,"countdown":4,"tags":[],"content":[{"t":"ul","items":[{"html":"In RStudio, on <code>dev<\/code>: new text file <code>questions.md<\/code> at the top of the repository, the three questions typed in, saved. Git pane: stage, message <code>docs: add my three questions<\/code>, commit. The way it was done in July.","text":"In RStudio, on dev: new text file questions.md at the top of the repository, the three questions typed in, saved. Git pane: stage, message docs: add my three questions, commit. The way it was done in July.","children":[]},{"html":"Why: the agent can read the file later, the cards quote from it, and the declaration at 15:45 shows one commit by hand next to the assisted ones. This is rung 1 of the ladder, lived before it is named.","text":"Why: the agent can read the file later, the cards quote from it, and the declaration at 15:45 shows one commit by hand next to the assisted ones. This is rung 1 of the ladder, lived before it is named.","children":[]}]}]},{"id":"s7","title":"Who commits, and how often","min":3,"countdown":null,"tags":[],"content":[{"t":"ul","items":[{"html":"The ladder with the issue step: do all commits yourself (you just did); tell the agent when to commit; let the agent commit, you write the issues and open the PR; let the agent make the whole PR. Sprint 1 climbs to rung 2, sprint 2 to rung 3.","text":"The ladder with the issue step: do all commits yourself (you just did); tell the agent when to commit; let the agent commit, you write the issues and open the PR; let the agent make the whole PR. Sprint 1 climbs to rung 2, sprint 2 to rung 3.","children":[]},{"html":"Commit often: after every run that changed a file. Small commits are cheap to read and cheap to undo. One pull request per sprint, when the chunk is done. The pull request skill pushes first and tells you how many commits went up.","text":"Commit often: after every run that changed a file. Small commits are cheap to read and cheap to undo. One pull request per sprint, when the chunk is done. The pull request skill pushes first and tells you how many commits went up.","children":[]}]}]},{"id":"s8","title":"Our turn: two skills","min":5,"countdown":null,"tags":[],"content":[{"t":"ul","items":[{"html":"In Claude Code: <code>/plugin marketplace add Global-Health-Engineering/skills<\/code>, then <code>/plugin install ghe-skills@ghe-skills<\/code>, then <code>/exit<\/code> and <code>claude<\/code> again. Sticky note when <code>/ghe-skills:commit<\/code> shows in the command list. A failed install goes to the helper in the break.","text":"In Claude Code: /plugin marketplace add Global-Health-Engineering/skills, then /plugin install ghe-skills@ghe-skills, then /exit and claude again. Sticky note when /ghe-skills:commit shows in the command list. A failed install goes to the helper in the break.","children":[]},{"html":"Break slide with question 1, restart 10:35.","text":"Break slide with question 1, restart 10:35.","children":[]}]}]}],"orphanSections":[],"breakQuestion":null},{"id":"b1015","title":"Snack break 1","start":"10:15","end":"10:35","min":20,"tags":[],"startIso":"2026-09-29T10:15:00+02:00","endIso":"2026-09-29T10:35:00+02:00","slides":[],"intro":["Question 1 on the screen. Helper fixes failed installs from a known list."],"rows":[],"sections":[],"orphanSections":[],"breakQuestion":{"question":"What in your data folder would you not want a model to read?","opens":"One last look at data/ before the first run"}},{"id":"b1035","title":"Sprint 1: the loop by hand, first run, studio, ship v0.1.0","start":"10:35","end":"12:00","min":85,"tags":[],"startIso":"2026-09-29T10:35:00+02:00","endIso":"2026-09-29T12:00:00+02:00","slides":["Question 1 opener","Your turn (be the agent)","The day sheet","Round 2 (variable)","Your turn (the framed run, then commit)","What scrolled past","The studio (the cards)","Your turn (the studio)","Stand up","The release path","Our turn (ship v0.1.0)","The 18 tasks","Lunch"],"intro":[],"rows":[{"id":"b1035/r0","min":2,"label":"Opens with question 1, one last look at data/","html":"Opens with question 1, one last look at <code>data/<\/code>","sections":[],"question":"What in your data folder would you not want a model to read?"},{"id":"b1035/r1","min":6,"label":"Your turn: be the agent, on the setup repository","html":"Your turn: be the agent, on the setup repository","sections":["s0"]},{"id":"b1035/r2","min":1,"label":"The day sheet, handed out","html":"The day sheet, handed out","sections":["s1"]},{"id":"b1035/r3","min":18,"label":"Your turn: the framed run, then commit","html":"Your turn: the framed run, then commit","sections":["s2"]},{"id":"b1035/r4","min":2,"label":"What scrolled past","html":"What scrolled past","sections":["s3"]},{"id":"b1035/r5","min":1,"label":"The studio: ten cards","html":"The studio: ten cards","sections":["s4"]},{"id":"b1035/r6","min":35,"label":"Your turn: the studio, stand-up at minute 15","html":"Your turn: the studio, stand-up at minute 15","sections":["s4"]},{"id":"b1035/r7","min":16,"label":"The release path, Our turn: ship v0.1.0 (protected, may spill into lunch)","html":"The release path, Our turn: ship v0.1.0 (protected, may spill into lunch)","sections":["s5"]},{"id":"b1035/r8","min":2,"label":"The 18 tasks","html":"The 18 tasks","sections":["s6"]},{"id":"b1035/r9","min":2,"label":"Buffer, lunch slide","html":"Buffer, lunch slide","sections":[]}],"sections":[{"id":"s0","title":"Your turn: be the agent","min":6,"countdown":5,"tags":[],"content":[{"t":"ul","items":[{"html":"In the chat, not in Claude Code, and on the public data of the setup repository from the pre-work, not your own: \"I have a repository with data. Ask me for the files you need to answer this question, one at a time, and I will paste what you ask for: what is in this data?\" Paste by hand. Feel the loop.","text":"In the chat, not in Claude Code, and on the public data of the setup repository from the pre-work, not your own: \"I have a repository with data. Ask me for the files you need to answer this question, one at a time, and I will paste what you ask for: what is in this data?\" Paste by hand. Feel the loop.","children":[]}]}]},{"id":"s1","title":"The day sheet","min":1,"countdown":null,"tags":[],"content":[{"t":"ul","items":[{"html":"One slide with the first two rows. The helper hands the sheets out while it is up. Columns: what happened, what it assumed, minutes it ran, would I merge this, committed. One row per run all day: the first run, each card, the plan, the issues, the TODOs, the rerun, the declaration. The sheet is the material for the 13:00 reflect, the 16:00 checklist and page 2 of the zine.","text":"One slide with the first two rows. The helper hands the sheets out while it is up. Columns: what happened, what it assumed, minutes it ran, would I merge this, committed. One row per run all day: the first run, each card, the plan, the issues, the TODOs, the rerun, the declaration. The sheet is the material for the 13:00 reflect, the 16:00 checklist and page 2 of the zine.","children":[]}]}]},{"id":"s2","title":"Your turn: the framed run, then commit","min":18,"countdown":15,"tags":[],"content":[{"t":"ul","items":[{"html":"Everyone types the same frame with question 1 in it, nothing else: \"Answer the following question using the data in this repository and write up the result as a Quarto manuscript that renders to DOCX: &lt;your question 1&gt;.\" The DOCX line is in the frame so the Render button at 11:40 gives everyone a DOCX for the release.","text":"Everyone types the same frame with question 1 in it, nothing else: \"Answer the following question using the data in this repository and write up the result as a Quarto manuscript that renders to DOCX: <your question 1>.\" The DOCX line is in the frame so the Render button at 11:40 gives everyone a DOCX for the release.","children":[]},{"html":"Watch the tool calls. Do not intervene. When it stops: <code>/ghe-skills:commit<\/code>. Read the message it proposes. Fill the first row of the day sheet. Sticky note when the commit is in.","text":"Watch the tool calls. Do not intervene. When it stops: /ghe-skills:commit. Read the message it proposes. Fill the first row of the day sheet. Sticky note when the commit is in.","children":[]},{"html":"The dry run measured 12 minutes for a first run on a 180-page PDF, plus 1.5 for the skill and a minute of reading; the block holds that with two minutes to spare. A CSV should come in under 5.","text":"The dry run measured 12 minutes for a first run on a 180-page PDF, plus 1.5 for the skill and a minute of reading; the block holds that with two minutes to spare. A CSV should come in under 5.","children":[]}]}]},{"id":"s3","title":"What scrolled past","min":2,"countdown":null,"tags":[],"content":[{"t":"ul","items":[{"html":"Every line was a tool call: read a file, list a folder, write a file, run a command. That is the loop they did by hand in the chat, run by a program on the laptop; the model on the server only sees what that program sends. The result is files and a commit in the repository, against a thread in an account.","text":"Every line was a tool call: read a file, list a folder, write a file, run a command. That is the loop they did by hand in the chat, run by a program on the laptop; the model on the server only sees what that program sends. The result is files and a commit in the repository, against a thread in an account.","children":[]}]}]},{"id":"s4","title":"Your turn: the studio","min":35,"countdown":35,"tags":["PROTECTED","FLOOR 25"],"content":[{"t":"ul","items":[{"html":"Ten cards on the table. Each card: a prompt frame, one line on what to watch for, and the same last line: if it changed a file, commit; either way, fill one row of the day sheet. Pick freely. At least two cards. Card 4 (one figure, rendered) is recommended for everyone: it is the render test for the ship at 11:40.","text":"Ten cards on the table. Each card: a prompt frame, one line on what to watch for, and the same last line: if it changed a file, commit; either way, fill one row of the day sheet. Pick freely. At least two cards. Card 4 (one figure, rendered) is recommended for everyone: it is the render test for the ship at 11:40.","children":[]},{"html":"Rules inside the studio: if it asks, answer; stuck for two minutes, raise a hand and take another card. Cards 6 and 7 for the stuck (nothing can break), cards 8, 9 and 10 for the fast.","text":"Rules inside the studio: if it asks, answer; stuck for two minutes, raise a hand and take another card. Cards 6 and 7 for the stuck (nothing can break), cards 8, 9 and 10 for the fast.","children":[]},{"html":"At minute 15: everyone stands up, reads one other screen for one minute, sits down. There is no gallery walk; this is it.","text":"At minute 15: everyone stands up, reads one other screen for one minute, sits down. There is no gallery walk; this is it.","children":[]},{"html":"Instructor and helper circulate. Fix nothing longer than two minutes; park and move on. Anyone whose card 4 did not render is on the helper's lunch list.","text":"Instructor and helper circulate. Fix nothing longer than two minutes; park and move on. Anyone whose card 4 did not render is on the helper's lunch list.","children":[]}]}]},{"id":"s5","title":"Our turn: ship v0.1.0","min":16,"countdown":14,"tags":["PROTECTED","SCRIPT"],"content":[{"t":"p","html":"Step by step, everyone at the same time. The release path slide first (1): pull request merged into main, manuscript rendered in RStudio, tag, release with the artifact, dev synced. Sprint 1 does it rough."},{"t":"ol","items":[{"html":"<code>/ghe-skills:open-pr<\/code>. The skill pushes first and reports \"Pushed N commits to origin/dev\". When it offers the test plan, answer no. The first pull request of the day: the chunk is done.","text":"/ghe-skills:open-pr. The skill pushes first and reports \"Pushed N commits to origin/dev\". When it offers the test plan, answer no. The first pull request of the day: the chunk is done.","children":[],"n":1,"min":3,"id":"b1035/s5/i0"},{"html":"On GitHub: open it, one minute on Files changed, merge it yourself. No reviewer, on purpose; sprint 2 has one.","text":"On GitHub: open it, one minute on Files changed, merge it yourself. No reviewer, on purpose; sprint 2 has one.","children":[],"n":2,"min":3,"id":"b1035/s5/i1"},{"html":"\"Switch to main and pull.\" Point at the terminal: main and dev now hold the same work; the merge went through.","text":"\"Switch to main and pull.\" Point at the terminal: main and dev now hold the same work; the merge went through.","children":[],"n":3,"min":1,"id":"b1035/s5/i2"},{"html":"In RStudio: open the manuscript, press Render. The bundled Quarto renders the DOCX next to the source, no PATH problem, a minute of Quarto practice. If it fails, say so in the release note and move on.","text":"In RStudio: open the manuscript, press Render. The bundled Quarto renders the DOCX next to the source, no PATH problem, a minute of Quarto practice. If it fails, say so in the release note and move on.","children":[],"n":4,"min":2,"id":"b1035/s5/i3"},{"html":"\"Tag v0.1.0 and create a GitHub release. Attach the DOCX if it rendered; if not, say in the release note that the manuscript does not render yet.\"","text":"\"Tag v0.1.0 and create a GitHub release. Attach the DOCX if it rendered; if not, say in the release note that the manuscript does not render yet.\"","children":[],"n":5,"min":3,"id":"b1035/s5/i4"},{"html":"\"Switch to dev, merge main into it, and push.\" Never leave a release on main with dev behind it.","text":"\"Switch to dev, merge main into it, and push.\" Never leave a release on main with dev behind it.","children":[],"n":6,"min":1,"id":"b1035/s5/i5"},{"html":"Sticky note when the release page is up, with or without the DOCX. On the release page: download the DOCX. This is the file you would email a co-author without Git, or drop in a cloud folder for review.","text":"Sticky note when the release page is up, with or without the DOCX. On the release page: download the DOCX. This is the file you would email a co-author without Git, or drop in a cloud folder for review.","children":[],"n":7,"min":1,"id":"b1035/s5/i6"}]},{"t":"p","html":"The dry run measured 3.6 minutes of agent time for the five prompts; the rest of the block is reading the pull request and the release page. If the room is still shipping at 12:00, lunch starts when the release pages are up. Whoever is not up by 12:05 goes on the helper's lunch list and eats first."}]},{"id":"s6","title":"The 18 tasks and lunch","min":4,"countdown":null,"tags":[],"content":[{"t":"ul","items":[{"html":"The 18 tasks slide with the screenshot from the ISC consultation: the proposed standard for declaring AI use lists 18 research tasks and you tick the ones AI touched. One sentence: this is the taxonomy that came out of round 1, it is the printed checklist at 16:00, and the lunch question uses it. (2)","text":"The 18 tasks slide with the screenshot from the ISC consultation: the proposed standard for declaring AI use lists 18 research tasks and you tick the ones AI touched. One sentence: this is the taxonomy that came out of round 1, it is the printed checklist at 16:00, and the lunch question uses it. (2)","children":[]},{"html":"Lunch slide with the lunch question and \"pick your sprint 2 question over lunch: question 1 done properly, or question 2\". Countdown 60. (2)","text":"Lunch slide with the lunch question and \"pick your sprint 2 question over lunch: question 1 done properly, or question 2\". Countdown 60. (2)","children":[]}]}]}],"orphanSections":[],"breakQuestion":null},{"id":"b1200","title":"Lunch","start":"12:00","end":"13:00","min":60,"tags":[],"startIso":"2026-09-29T12:00:00+02:00","endIso":"2026-09-29T13:00:00+02:00","slides":[],"intro":["Lunch question on the screen. Helper works the list: failed renders first, then releases that did not happen."],"rows":[],"sections":[],"orphanSections":[],"breakQuestion":{"question":"Of the 18 tasks in writing a paper, which did the agent touch in sprint 1, and which would you never hand over? Pick your sprint 2 question.","opens":"The plan starts, then the stakes ladder"}},{"id":"b1300","title":"Between sprints: what v0.1.0 shows","start":"13:00","end":"13:20","min":20,"tags":[],"startIso":"2026-09-29T13:00:00+02:00","endIso":"2026-09-29T13:20:00+02:00","slides":["Our turn (start your plan)","Stakes ladder","Reflect on v0.1.0","Where repositories live","Inside a repository","Our turn (look inside your files)"],"intro":[],"rows":[{"id":"b1300/r0","min":2,"label":"Our turn: start your plan, in plan mode, then to the floor","html":"Our turn: start your plan, in plan mode, then to the floor","sections":["s0"]},{"id":"b1300/r1","min":5,"label":"Stakes ladder on the floor (opens with the lunch question)","html":"Stakes ladder on the floor (opens with the lunch question)","sections":["s1"]},{"id":"b1300/r2","min":4,"label":"Reflect with the release page open","html":"Reflect with the release page open","sections":["s2"]},{"id":"b1300/r3","min":5,"label":"Folders and files, three levels","html":"Folders and files, three levels","sections":["s3"]},{"id":"b1300/r4","min":4,"label":"Our turn: look inside your files","html":"Our turn: look inside your files","sections":["s4"]}],"sections":[{"id":"s0","title":"Our turn: start your plan","min":2,"countdown":2,"tags":["SCRIPT"],"content":[{"t":"ol","items":[{"html":"Shift+Tab until the line says plan mode on. (Everyone, me included, on the demo repository.)","text":"Shift+Tab until the line says plan mode on. (Everyone, me included, on the demo repository.)","children":[],"n":1,"min":null,"id":"b1300/s0/i0"},{"html":"The morning frame with the sprint 2 question, plus one line: \"Plan only. Do not run any analysis or write any file yet.\"","text":"The morning frame with the sprint 2 question, plus one line: \"Plan only. Do not run any analysis or write any file yet.\"","children":[],"n":2,"min":null,"id":"b1300/s0/i1"},{"html":"Leave it running. Come to the floor.","text":"Leave it running. Come to the floor.","children":[],"n":3,"min":null,"id":"b1300/s0/i2"}]},{"t":"p","html":"Why: in the dry run the frame alone took 18.5 minutes in plan mode on a PDF, because the agent ran the analysis to plan it. The plan now runs while the room is on the ladder, the way the walk covers the hand-over. The \"plan only\" line is meant to shorten it and has not been measured; whatever is back at 13:28 is what the Your turn starts from."}]},{"id":"s1","title":"Stakes ladder","min":5,"countdown":null,"tags":[],"content":[{"t":"ul","items":[{"html":"Opens with the lunch question: two answers, then everybody up. Four rungs taped on the floor: implement it; plan, then implement; plan, review the plan, implement, review the implementation; design first, then repeat the cycles. The compact version was on the opening slide. Sprint 1 was rung 1. Stand on the rung for the question you will take through sprint 2, then for \"a figure in your thesis\", then for \"a throwaway plot\". Sit down.","text":"Opens with the lunch question: two answers, then everybody up. Four rungs taped on the floor: implement it; plan, then implement; plan, review the plan, implement, review the implementation; design first, then repeat the cycles. The compact version was on the opening slide. Sprint 1 was rung 1. Stand on the rung for the question you will take through sprint 2, then for \"a figure in your thesis\", then for \"a throwaway plot\". Sit down.","children":[]}]}]},{"id":"s2","title":"Reflect on v0.1.0","min":4,"countdown":null,"tags":[],"content":[{"t":"ul","items":[{"html":"Release page open on every screen, day sheet in hand. What did it assume without asking? Where did it put files and how did it name them? How many commits did sprint 1 produce (hands up: three or more)? Would I send v0.1.0 to a co-author?","text":"Release page open on every screen, day sheet in hand. What did it assume without asking? Where did it put files and how did it name them? How many commits did sprint 1 produce (hands up: three or more)? Would I send v0.1.0 to a co-author?","children":[]},{"html":"From the dry run, if the room is quiet: the manuscript at the root, data files with underscores, no metadata folder, the author name from the machine. The numbers were right; the layout was the agent's.","text":"From the dry run, if the room is quiet: the manuscript at the root, data files with underscores, no metadata folder, the author name from the machine. The numbers were right; the layout was the agent's.","children":[]}]}]},{"id":"s3","title":"Folder and file organisation, three levels","min":5,"countdown":null,"tags":[],"content":[{"t":"ul","items":[{"html":"Level 1, where repositories live: <code>gitrepos/<\/code> with <code>gh-org-agentsforsci-ghe/<\/code>, <code>gh-org-gitforsci-ghe/<\/code> and <code>gh-rainbow-train/<\/code> side by side, never in a cloud-synced folder. The agent starts inside the repository, never one level up.","text":"Level 1, where repositories live: gitrepos/ with gh-org-agentsforsci-ghe/, gh-org-gitforsci-ghe/ and gh-rainbow-train/ side by side, never in a cloud-synced folder. The agent starts inside the repository, never one level up.","children":[]},{"html":"Level 2, inside a repository: the template as a tree (<code>data/raw_data/<\/code>, <code>data/derived_data/<\/code>, <code>data/metadata/codebook.csv<\/code>, <code>analysis/<\/code>, <code>docs/reports/<\/code>, <code>src/<\/code>). <mark>Confirm the template before the day.<\/mark> The question on the slide: where would your v0.1.0 files belong in here? That answer is the rejection sentence at 13:28.","text":"Level 2, inside a repository: the template as a tree (data/raw_data/, data/derived_data/, data/metadata/codebook.csv, analysis/, docs/reports/, src/). [Confirm the template before the day.] The question on the slide: where would your v0.1.0 files belong in here? That answer is the rejection sentence at 13:28.","children":[]},{"html":"Level 3, file names: lowercase, dash as separator, short, two-digit prefix for scripts (<code>01-read-data.R<\/code>).","text":"Level 3, file names: lowercase, dash as separator, short, two-digit prefix for scripts (01-read-data.R).","children":[]}]}]},{"id":"s4","title":"Our turn: look inside your files","min":4,"countdown":4,"tags":["SCRIPT"],"content":[{"t":"ol","items":[{"html":"In RStudio: open the manuscript <code>.qmd<\/code> the agent wrote this morning. Text you can read.","text":"In RStudio: open the manuscript .qmd the agent wrote this morning. Text you can read.","children":[],"n":1,"min":1,"id":"b1300/s4/i0"},{"html":"Open the CSV in the editor (View File, not Import). Type one row at the bottom by hand. Then undo it and save nothing, so the working tree stays clean for the plan commit.","text":"Open the CSV in the editor (View File, not Import). Type one row at the bottom by hand. Then undo it and save nothing, so the working tree stays clean for the plan commit.","children":[],"n":2,"min":1,"id":"b1300/s4/i1"},{"html":"On the projector: unzip the DOCX from the v0.1.0 release (rename to .zip, or <code>unzip<\/code> in a terminal). Inside: folders of XML. An XLSX opens the same way.","text":"On the projector: unzip the DOCX from the v0.1.0 release (rename to .zip, or unzip in a terminal). Inside: folders of XML. An XLSX opens the same way.","children":[],"n":3,"min":1,"id":"b1300/s4/i2"},{"html":"One line: the source is text you can read, type and diff; the DOCX is generated from it, so never edit the DOCX; and the PDF cost the agent a table extraction across pages this morning.","text":"One line: the source is text you can read, type and diff; the DOCX is generated from it, so never edit the DOCX; and the PDF cost the agent a table extraction across pages this morning.","children":[],"n":4,"min":1,"id":"b1300/s4/i3"}]},{"t":"p","html":"The DOCX and XLSX peek is mine on screen, since everyone's agent is busy planning. Rehearse the unzip."}]}],"orphanSections":[],"breakQuestion":null},{"id":"b1320","title":"Sprint 2: plan mode, issues, partner review","start":"13:20","end":"14:10","min":50,"tags":[],"startIso":"2026-09-29T13:20:00+02:00","endIso":"2026-09-29T14:10:00+02:00","slides":["Round 3 (variable)","My turn (plan mode)","Your turn (plan mode)","Pair talk","Round 4 (variable)","Your turn (the issues)","Find your review partner"],"intro":["The helper lays out the afternoon snacks during the partner review."],"rows":[{"id":"b1320/r0","min":1,"label":"Round 3 slide","html":"Round 3 slide","sections":[]},{"id":"b1320/r1","min":7,"label":"My turn: plan mode","html":"My turn: plan mode","sections":["s0"]},{"id":"b1320/r2","min":12,"label":"Your turn: plan mode, two commits","html":"Your turn: plan mode, two commits","sections":["s1"]},{"id":"b1320/r3","min":3,"label":"Pair talk","html":"Pair talk","sections":["s2"]},{"id":"b1320/r4","min":1,"label":"Round 4 slide","html":"Round 4 slide","sections":[]},{"id":"b1320/r5","min":6,"label":"Your turn: the issues","html":"Your turn: the issues","sections":["s3"]},{"id":"b1320/r6","min":10,"label":"Partner review of issues 1 and 2 (protected)","html":"Partner review of issues 1 and 2 (protected)","sections":["s4"]},{"id":"b1320/r7","min":10,"label":"Buffer, absorbs a plan that ran long","html":"Buffer, absorbs a plan that ran long","sections":[]}],"sections":[{"id":"s0","title":"My turn: round 3, plan mode","min":7,"countdown":null,"tags":["DEMO SCRIPT"],"content":[{"t":"p","html":"Terminal at <code>~/Documents/gitrepos/gh-org-agentsforsci-ghe/fstp-eval-india<\/code>, branch <code>dev<\/code>, after its own rough v0.1.0. My plan started at 13:00 with the room, in plan mode, with the \"plan only\" line."},{"t":"ol","items":[{"html":"Read out what came back. In the dry run the first plan proposed extracting Table 9 (pages 34 to 35) to a CSV somewhere, with its own layout.","text":"Read out what came back. In the dry run the first plan proposed extracting Table 9 (pages 34 to 35) to a CSV somewhere, with its own layout.","children":[],"n":1,"min":2,"id":"b1320/s0/i0"},{"html":"Reject with one sentence: \"Not like this: the PDF stays in <code>data/raw_data/<\/code>, the extracted table goes to <code>data/derived_data/<\/code>, a codebook to <code>data/metadata/codebook.csv<\/code>, the manuscript to <code>analysis/<\/code>, and files are named lowercase with dashes and a two-digit prefix for scripts.\"","text":"Reject with one sentence: \"Not like this: the PDF stays in data/raw_data/, the extracted table goes to data/derived_data/, a codebook to data/metadata/codebook.csv, the manuscript to analysis/, and files are named lowercase with dashes and a two-digit prefix for scripts.\"","children":[],"n":2,"min":1,"id":"b1320/s0/i1"},{"html":"Shift+Tab until the line says auto mode on. Say why: in plan mode the agent writes its plan outside the repository and refuses to write inside it; the file only lands in the repository after leaving plan mode.","text":"Shift+Tab until the line says auto mode on. Say why: in plan mode the agent writes its plan outside the repository and refuses to write inside it; the file only lands in the repository after leaving plan mode.","children":[],"n":3,"min":1,"id":"b1320/s0/i2"},{"html":"\"Write the plan as a markdown file in this repository that I can edit.\" Open it.","text":"\"Write the plan as a markdown file in this repository that I can edit.\" Open it.","children":[],"n":4,"min":1,"id":"b1320/s0/i3"},{"html":"<code>/ghe-skills:commit<\/code>. The agent's plan, one assisted commit.","text":"/ghe-skills:commit. The agent's plan, one assisted commit.","children":[],"n":5,"min":1,"id":"b1320/s0/i4"},{"html":"In RStudio: change one line of the plan file, save. Stage, commit by hand, as at 09:55. Two commits: the skill's for the agent's plan, mine for my line. A plan is worth a commit.","text":"In RStudio: change one line of the plan file, save. Stage, commit by hand, as at 09:55. Two commits: the skill's for the agent's plan, mine for my line. A plan is worth a commit.","children":[],"n":6,"min":1,"id":"b1320/s0/i5"}]}]},{"id":"s1","title":"Your turn: plan mode","min":12,"countdown":12,"tags":[],"content":[{"t":"ul","items":[{"html":"Same seven steps on the slide. Read the plan that came back; reject it in one sentence that points at the template and the naming rules; Shift+Tab out of plan mode; ask for the plan as a markdown file in the repository; <code>/ghe-skills:commit<\/code>; change one line in RStudio; commit by hand. Fill one row. Sticky note when both commits are in.","text":"Same seven steps on the slide. Read the plan that came back; reject it in one sentence that points at the template and the naming rules; Shift+Tab out of plan mode; ask for the plan as a markdown file in the repository; /ghe-skills:commit; change one line in RStudio; commit by hand. Fill one row. Sticky note when both commits are in.","children":[]},{"html":"If someone's plan is not back yet: wait two minutes and read the demo's meanwhile; the 10-minute buffer at the end of the block is for this.","text":"If someone's plan is not back yet: wait two minutes and read the demo's meanwhile; the 10-minute buffer at the end of the block is for this.","children":[]},{"html":"Do not implement anything.","text":"Do not implement anything.","children":[]}]}]},{"id":"s2","title":"Pair talk","min":3,"countdown":3,"tags":[],"content":[{"t":"ul","items":[{"html":"What did one sentence change? Would I merge this plan?","text":"What did one sentence change? Would I merge this plan?","children":[]}]}]},{"id":"s3","title":"Your turn: the issues","min":6,"countdown":6,"tags":[],"content":[{"t":"ul","items":[{"html":"The literal prompt is on the slide: \"Turn the plan into four issues on this repository, each with a title, what done looks like in at most five checkboxes, and the files it touches: 1. Organise the repository following the template. 2. The analysis inside the Quarto manuscript with format: docx, one figure from a code chunk. 3. Five references from my Zotero library. 4. A methods paragraph.\" Sticky note when the issues are on GitHub. Fill one row.","text":"The literal prompt is on the slide: \"Turn the plan into four issues on this repository, each with a title, what done looks like in at most five checkboxes, and the files it touches: 1. Organise the repository following the template. 2. The analysis inside the Quarto manuscript with format: docx, one figure from a code chunk. 3. Five references from my Zotero library. 4. A methods paragraph.\" Sticky note when the issues are on GitHub. Fill one row.","children":[]},{"html":"Two minutes measured in the dry run. The checkbox cap is there so the partner can read the issues in ten minutes.","text":"Two minutes measured in the dry run. The checkbox cap is there so the partner can read the issues in ten minutes.","children":[]}]}]},{"id":"s4","title":"Find your review partner, review issues 1 and 2","min":10,"countdown":10,"tags":["PROTECTED"],"content":[{"t":"ul","items":[{"html":"Move to sit with your partner (neighbour pairs, triple if odd). Review each other's issues 1 and 2 on GitHub, the two the agent implements next, before any code exists. Comment where a step is unclear or done is not defined.","text":"Move to sit with your partner (neighbour pairs, triple if odd). Review each other's issues 1 and 2 on GitHub, the two the agent implements next, before any code exists. Comment where a step is unclear or done is not defined.","children":[]}]}]}],"orphanSections":[],"breakQuestion":null},{"id":"b1410","title":"Hand-over to the phone","start":"14:10","end":"14:20","min":10,"tags":[],"startIso":"2026-09-29T14:10:00+02:00","endIso":"2026-09-29T14:20:00+02:00","slides":["Our turn (hand-over)","Snack break 2 (walk with your agent)"],"intro":[],"rows":[{"id":"b1410/r0","min":8,"label":"Our turn: hand-over to the phone","html":"Our turn: hand-over to the phone","sections":["s0"]}],"sections":[{"id":"s0","title":"Our turn: hand-over to the phone","min":8,"countdown":null,"tags":["SCRIPT"],"content":[{"t":"p","html":"Step by step, everyone at the same time. First pairing of the day; the helper checked the app and the account at the door."},{"t":"ol","items":[{"html":"In the session: \"Implement issues 1 and 2 on the dev branch. Run /ghe-skills:commit after each issue, then push. Ask me when you are unsure.\"","text":"In the session: \"Implement issues 1 and 2 on the dev branch. Run /ghe-skills:commit after each issue, then push. Ask me when you are unsure.\"","children":[],"n":1,"min":2,"id":"b1410/s0/i0"},{"html":"Type <code>/remote-control<\/code>. A link and a QR code appear.","text":"Type /remote-control. A link and a QR code appear.","children":[],"n":2,"min":1,"id":"b1410/s0/i1"},{"html":"Scan the QR code with the Claude app, or open Code in the app: the session shows a computer icon with a green dot.","text":"Scan the QR code with the Claude app, or open Code in the app: the session shows a computer icon with a green dot.","children":[],"n":3,"min":2,"id":"b1410/s0/i2"},{"html":"Send one message from the phone: \"Status?\" The answer appears on both screens.","text":"Send one message from the phone: \"Status?\" The answer appears on both screens.","children":[],"n":4,"min":1,"id":"b1410/s0/i3"},{"html":"Laptop plugged in, lid open, terminal open.","text":"Laptop plugged in, lid open, terminal open.","children":[],"n":5,"min":1,"id":"b1410/s0/i4"},{"html":"Break slide with question 3. Snack in hand, go outside.","text":"Break slide with question 3. Snack in hand, go outside.","children":[],"n":6,"min":1,"id":"b1410/s0/i5"}]},{"t":"p","html":"Fallback for a failed pairing: leave the laptop running, go outside anyway, read the transcript on return. Same-account check: <code>/status<\/code> on the laptop, the account and organisation in the app. In the dry run the run took 14 minutes and asked nothing; the walk is long enough."}]}],"orphanSections":[],"breakQuestion":null},{"id":"b1420","title":"Snack break 2: walk with your agent","start":"14:20","end":"14:40","min":20,"tags":["PROTECTED"],"startIso":"2026-09-29T14:20:00+02:00","endIso":"2026-09-29T14:40:00+02:00","slides":[],"intro":["Question 3 on the screen. Check progress from the phone every few minutes, answer what it asks, do not start new tasks. The helper stays inside with the laptops."],"rows":[],"sections":[],"orphanSections":[],"breakQuestion":{"question":"Walk with your agent: what does it ask you, and what does it decide alone?","opens":"One note each, kept for the oversight flipchart at 16:00"}},{"id":"b1440","title":"Sprint 2: review, CLAUDE.md, rerun, merge","start":"14:40","end":"15:30","min":50,"tags":[],"startIso":"2026-09-29T14:40:00+02:00","endIso":"2026-09-29T15:30:00+02:00","slides":["Question 3 opener","Your turn (finish, review, open the pull request)","Partner review (approve, do not merge yet)","CLAUDE.md","CLAUDE.md against a skill","CSV against data package (one slide)","Round 5 (variable)","Your turn (round 5)","Partner merges"],"intro":[],"rows":[{"id":"b1440/r0","min":3,"label":"Opens with question 3, one note each for the oversight flipchart","html":"Opens with question 3, one note each for the oversight flipchart","sections":["s0"],"question":"Walk with your agent: what does it ask you, and what does it decide alone?"},{"id":"b1440/r1","min":14,"label":"Your turn: finish, TODOs, open the pull request","html":"Your turn: finish, TODOs, open the pull request","sections":["s1"]},{"id":"b1440/r2","min":8,"label":"Partner review: approve, do not merge yet","html":"Partner review: approve, do not merge yet","sections":["s2"]},{"id":"b1440/r3","min":3,"label":"CLAUDE.md, CLAUDE.md against a skill, CSV against data package","html":"CLAUDE.md, CLAUDE.md against a skill, CSV against data package","sections":["s3"]},{"id":"b1440/r4","min":20,"label":"Your turn: round 5 (protected)","html":"Your turn: round 5 (protected)","sections":["s4"]},{"id":"b1440/r5","min":2,"label":"Partner merges","html":"Partner merges","sections":["s5"]}],"sections":[{"id":"s0","title":"What did it ask you?","min":3,"countdown":null,"tags":[],"content":[{"t":"ul","items":[{"html":"Opens with question 3: what did it ask you, what did it decide alone. One note each, one line, collected and kept for the third flipchart at 16:00 (how do you describe the oversight that was actually done).","text":"Opens with question 3: what did it ask you, what did it decide alone. One note each, one line, collected and kept for the third flipchart at 16:00 (how do you describe the oversight that was actually done).","children":[]},{"html":"From the dry run, if the room is quiet: it asked nothing and decided four things alone. The author name from the machine account; reading the Zotero database file when the tool returned nothing; moving the sprint 1 files during the restructure; keeping three older charts.","text":"From the dry run, if the room is quiet: it asked nothing and decided four things alone. The author name from the machine account; reading the Zotero database file when the tool returned nothing; moving the sprint 1 files during the restructure; keeping three older charts.","children":[]}]}]},{"id":"s1","title":"Your turn: finish, review, open the pull request","min":14,"countdown":14,"tags":[],"content":[{"t":"ol","items":[{"html":"Back at the laptop: read the diff. If the agent is not done, it finishes now. Commits are in (the skill ran after each issue).","text":"Back at the laptop: read the diff. If the agent is not done, it finishes now. Commits are in (the skill ran after each issue).","children":[],"n":1,"min":3,"id":"b1440/s1/i0"},{"html":"In RStudio: open the manuscript. Wherever you would not merge it, write <code>&lt;!-- TODO: what has to change --&gt;<\/code> (inside a code chunk, a line starting with <code># TODO<\/code>). Save. Stage and commit by hand. The human review leaves the markers.","text":"In RStudio: open the manuscript. Wherever you would not merge it, write <!-- TODO: what has to change --> (inside a code chunk, a line starting with # TODO). Save. Stage and commit by hand. The human review leaves the markers.","children":[],"n":2,"min":4,"id":"b1440/s1/i1"},{"html":"\"Work through the TODO comments in the manuscript one at a time. Remove each when it is done and run /ghe-skills:commit after each.\"","text":"\"Work through the TODO comments in the manuscript one at a time. Remove each when it is done and run /ghe-skills:commit after each.\"","children":[],"n":3,"min":4,"id":"b1440/s1/i2"},{"html":"Read the diff again. Then <code>/ghe-skills:open-pr<\/code>, answer no when it offers the test plan. The second and last pull request of the day. Sticky note when it is open. Fill one row.","text":"Read the diff again. Then /ghe-skills:open-pr, answer no when it offers the test plan. The second and last pull request of the day. Sticky note when it is open. Fill one row.","children":[],"n":4,"min":3,"id":"b1440/s1/i3"}]},{"t":"p","html":"Cut order if behind: at least one TODO and one commit."}]},{"id":"s2","title":"Partner review: approve, do not merge yet","min":8,"countdown":8,"tags":[],"content":[{"t":"ul","items":[{"html":"Partner reviews the pull request on GitHub, every line: would I merge this? Approve, or say what would have to change. Do not merge yet: round 5 adds the CLAUDE.md to the same pull request, so the tag carries it. Compare with the sprint 1 pull request nobody reviewed.","text":"Partner reviews the pull request on GitHub, every line: would I merge this? Approve, or say what would have to change. Do not merge yet: round 5 adds the CLAUDE.md to the same pull request, so the tag carries it. Compare with the sprint 1 pull request nobody reviewed.","children":[]}]}]},{"id":"s3","title":"CLAUDE.md, a skill, and the data package slide","min":3,"countdown":null,"tags":[],"content":[{"t":"ul","items":[{"html":"CLAUDE.md in the project folder: versioned, shared with collaborators, in the record. It holds what is true for this project: the template, the naming rules, where the codebook is, how to render. One line: a user level file exists on your machine, applies to every project, and never appears in the repository.","text":"CLAUDE.md in the project folder: versioned, shared with collaborators, in the record. It holds what is true for this project: the template, the naming rules, where the codebook is, how to render. One line: a user level file exists on your machine, applies to every project, and never appears in the repository.","children":[]},{"html":"CLAUDE.md against a skill: the \"when\" is always sent, the \"what\" loads on demand. Told it three times, put it in CLAUDE.md. Lots of text for one purpose, make it a skill. Never write skills prospectively.","text":"CLAUDE.md against a skill: the \"when\" is always sent, the \"what\" loads on demand. Told it three times, put it in CLAUDE.md. Lots of text for one purpose, make it a skill. Never write skills prospectively.","children":[]},{"html":"CSV against data package, one slide from the rehearsal: the same short prompt on a plain CSV and on the installed openwashdata package, two screenshots, one line. Documentation you wrote for a colleague is documentation the agent needs too. No live demo: it was the first cut in every layout, so it never happened. <mark>Take the two screenshots in rehearsal.<\/mark>","text":"CSV against data package, one slide from the rehearsal: the same short prompt on a plain CSV and on the installed openwashdata package, two screenshots, one line. Documentation you wrote for a colleague is documentation the agent needs too. No live demo: it was the first cut in every layout, so it never happened. [Take the two screenshots in rehearsal.]","children":[]}]}]},{"id":"s4","title":"Your turn: round 5","min":20,"countdown":20,"tags":["PROTECTED"],"content":[{"t":"ul","items":[{"html":"\"Write a CLAUDE.md for this repository from what we did today: the folder template, the naming rules, where the codebook is, how to render the manuscript. Then fill data/metadata/codebook.csv for the derived table.\" Commit. (8)","text":"\"Write a CLAUDE.md for this repository from what we did today: the folder template, the naming rules, where the codebook is, how to render the manuscript. Then fill data/metadata/codebook.csv for the derived table.\" Commit. (8)","children":[]},{"html":"New session (<code>/exit<\/code>, <code>claude<\/code>). Rerun the sprint 1 frame with question 1, word for word. Commit, if it has not already. \"Push the dev branch.\" (8)","text":"New session (/exit, claude). Rerun the sprint 1 frame with question 1, word for word. Commit, if it has not already. \"Push the dev branch.\" (8)","children":[]},{"html":"Pairs: the sprint 1 output next to this one. Did it follow the template without being told? What did it do with work that was already done? Would I merge this? (4)","text":"Pairs: the sprint 1 output next to this one. Did it follow the template without being told? What did it do with work that was already done? Would I merge this? (4)","children":[]},{"html":"Two things the dry run saw, to name aloud: a CLAUDE.md that says every change ends with the commit skill makes the agent commit on its own (rung 3 of the ladder, reached by documentation alone); and the rerun verified the existing answer against the PDF and added a check script instead of repeating the work.","text":"Two things the dry run saw, to name aloud: a CLAUDE.md that says every change ends with the commit skill makes the agent commit on its own (rung 3 of the ladder, reached by documentation alone); and the rerun verified the existing answer against the PDF and added a check script instead of repeating the work.","children":[]}]}]},{"id":"s5","title":"Partner merges","min":2,"countdown":null,"tags":[],"content":[{"t":"ul","items":[{"html":"The pull request now carries the issues, the TODO fixes, the CLAUDE.md and the rerun. The partner merges it. Sticky note when it is merged.","text":"The pull request now carries the issues, the TODO fixes, the CLAUDE.md and the rerun. The partner merges it. Sticky note when it is merged.","children":[]}]}]}],"orphanSections":[],"breakQuestion":null},{"id":"b1530","title":"Sprint 2: ship v0.2.0, declare both","start":"15:30","end":"16:00","min":30,"tags":["PROTECTED"],"startIso":"2026-09-29T15:30:00+02:00","endIso":"2026-09-29T16:00:00+02:00","slides":["Our turn (ship v0.2.0)","My turn (declaration)","Your turn (your declaration)"],"intro":[],"rows":[{"id":"b1530/r0","min":10,"label":"Our turn: ship v0.2.0","html":"Our turn: ship v0.2.0","sections":["s0"]},{"id":"b1530/r1","min":5,"label":"My turn: the declaration","html":"My turn: the declaration","sections":["s1"]},{"id":"b1530/r2","min":10,"label":"Your turn: your declaration over both releases","html":"Your turn: your declaration over both releases","sections":["s2"]},{"id":"b1530/r3","min":5,"label":"Buffer","html":"Buffer","sections":[]}],"sections":[{"id":"s0","title":"Our turn: ship v0.2.0","min":10,"countdown":10,"tags":["SCRIPT"],"content":[{"t":"p","html":"Same script as the morning, without the pull request step (the partner merged it)."},{"t":"ol","items":[{"html":"\"Switch to main and pull.\"","text":"\"Switch to main and pull.\"","children":[],"n":1,"min":2,"id":"b1530/s0/i0"},{"html":"In RStudio: open the manuscript, press Render. If it failed at lunch and again now, the release note says so, as in the morning.","text":"In RStudio: open the manuscript, press Render. If it failed at lunch and again now, the release note says so, as in the morning.","children":[],"n":2,"min":2,"id":"b1530/s0/i1"},{"html":"\"Tag v0.2.0 and create a GitHub release with the DOCX attached.\"","text":"\"Tag v0.2.0 and create a GitHub release with the DOCX attached.\"","children":[],"n":3,"min":3,"id":"b1530/s0/i2"},{"html":"\"Switch to dev, merge main into it, and push.\"","text":"\"Switch to dev, merge main into it, and push.\"","children":[],"n":4,"min":2,"id":"b1530/s0/i3"},{"html":"Open the two release pages side by side. Sticky note when both are up.","text":"Open the two release pages side by side. Sticky note when both are up.","children":[],"n":5,"min":1,"id":"b1530/s0/i4"}]}]},{"id":"s1","title":"My turn: the declaration","min":5,"countdown":null,"tags":["DEMO SCRIPT"],"content":[{"t":"ol","items":[{"html":"\"Write a declaration of AI use for this repository from the first commit to tag v0.2.0. Read the commit history and its trailers, the prompts folder, the issues, the pull requests and CLAUDE.md. Say which files an agent touched, in response to which instruction, who reviewed what, and what changed between v0.1.0 and v0.2.0. Put it in the release notes of v0.2.0.\"","text":"\"Write a declaration of AI use for this repository from the first commit to tag v0.2.0. Read the commit history and its trailers, the prompts folder, the issues, the pull requests and CLAUDE.md. Say which files an agent touched, in response to which instruction, who reviewed what, and what changed between v0.1.0 and v0.2.0. Put it in the release notes of v0.2.0.\"","children":[],"n":1,"min":3,"id":"b1530/s1/i0"},{"html":"Open the release notes. Count the commits it found: that is the commit rule paying off. In the dry run: twelve commits, eight assisted, one of them mixed, ten prompt files.","text":"Open the release notes. Count the commits it found: that is the commit rule paying off. In the dry run: twelve commits, eight assisted, one of them mixed, ten prompt files.","children":[],"n":2,"min":1,"id":"b1530/s1/i1"},{"html":"Say what the record covers and what it cannot. Commits with their trailers, the prompt files, the issues, the pull requests and CLAUDE.md are in. The prompts behind the issue texts, the pull request bodies and the release notes are not archived, because they changed nothing in git; the dry run's declaration flagged that gap itself, and a good declaration says so.","text":"Say what the record covers and what it cannot. Commits with their trailers, the prompt files, the issues, the pull requests and CLAUDE.md are in. The prompts behind the issue texts, the pull request bodies and the release notes are not archived, because they changed nothing in git; the dry run's declaration flagged that gap itself, and a good declaration says so.","children":[],"n":3,"min":1,"id":"b1530/s1/i2"},{"html":"If behind: skip the demo, two volunteers read a line of theirs at the end of the next step.","text":"If behind: skip the demo, two volunteers read a line of theirs at the end of the next step.","children":[],"n":4,"min":null,"id":"b1530/s1/i3"}]}]},{"id":"s2","title":"Your turn: your declaration","min":10,"countdown":8,"tags":[],"content":[{"t":"ul","items":[{"html":"Same prompt on your repository. Put the declaration into the notes of v0.2.0. Fill the last row of the day sheet. Two volunteers read one line aloud.","text":"Same prompt on your repository. Put the declaration into the notes of v0.2.0. Fill the last row of the day sheet. Two volunteers read one line aloud.","children":[]}]}]}],"orphanSections":[],"breakQuestion":null},{"id":"b1600","title":"Disclosure rules in the making: two records","start":"16:00","end":"16:30","min":30,"tags":["PROTECTED"],"startIso":"2026-09-29T16:00:00+02:00","endIso":"2026-09-29T16:30:00+02:00","slides":["Two sides of the room","The 18 tasks, two colours","Three flipcharts","What happens next"],"intro":["No response is written in the room. The block turns the day's two records into material for the GFRN AI working group."],"rows":[{"id":"b1600/r0","min":6,"label":"Two sides of the room","html":"Two sides of the room","sections":["s0"]},{"id":"b1600/r1","min":8,"label":"Your turn: the 18 tasks, two colours","html":"Your turn: the 18 tasks, two colours","sections":["s1"]},{"id":"b1600/r2","min":8,"label":"Three flipcharts","html":"Three flipcharts","sections":["s2"]},{"id":"b1600/r3","min":2,"label":"What happens next","html":"What happens next","sections":["s3"]},{"id":"b1600/r4","min":6,"label":"Buffer, absorbs a late ship","html":"Buffer, absorbs a late ship","sections":[]}],"sections":[{"id":"s0","title":"Two sides of the room","min":6,"countdown":5,"tags":[],"content":[{"t":"ul","items":[{"html":"\"Disclose if used at all\" on one side, \"a yes-or-no flag loses the intent\" on the other. Argue, cross over if persuaded. Use v0.1.0 and v0.2.0 as evidence: the same person, the same data, two records.","text":"\"Disclose if used at all\" on one side, \"a yes-or-no flag loses the intent\" on the other. Argue, cross over if persuaded. Use v0.1.0 and v0.2.0 as evidence: the same person, the same data, two records.","children":[]}]}]},{"id":"s1","title":"Your turn: the 18 tasks, two colours","min":8,"countdown":7,"tags":[],"content":[{"t":"ul","items":[{"html":"Printed checklist of the proposed taxonomy, the same 18 tasks as on the slide before lunch. In one colour, tick the tasks the agent touched in sprint 1; in the other, sprint 2. Your declaration and your day sheet are the source. Circle the ones a peer would need to know about (the \"substantive\" test). Compare with your lunch answer.","text":"Printed checklist of the proposed taxonomy, the same 18 tasks as on the slide before lunch. In one colour, tick the tasks the agent touched in sprint 1; in the other, sprint 2. Your declaration and your day sheet are the source. Circle the ones a peer would need to know about (the \"substantive\" test). Compare with your lunch answer.","children":[]}]}]},{"id":"s2","title":"Three flipcharts","min":8,"countdown":7,"tags":[],"content":[{"t":"ul","items":[{"html":"The consultation's open questions: placement (spread through the sections or one statement), a mandatory null statement, describing oversight. One sticky note per person per chart, one line each, from what the two records showed. The notes from 14:40 (what did it ask you, what did it decide alone) go on the third chart.","text":"The consultation's open questions: placement (spread through the sections or one statement), a mandatory null statement, describing oversight. One sticky note per person per chart, one line each, from what the two records showed. The notes from 14:40 (what did it ask you, what did it decide alone) go on the third chart.","children":[]}]}]},{"id":"s3","title":"What happens next","min":2,"countdown":null,"tags":[],"content":[{"t":"ul","items":[{"html":"The three flipcharts go to the GFRN AI working group. Round 2 of the consultation closes 16 October. The chat room stays open.","text":"The three flipcharts go to the GFRN AI working group. Round 2 of the consultation closes 16 October. The chat room stays open.","children":[]}]}]}],"orphanSections":[],"breakQuestion":null},{"id":"b1630","title":"Close: the zine","start":"16:30","end":"17:00","min":30,"tags":["PROTECTED","HARD START"],"startIso":"2026-09-29T16:30:00+02:00","endIso":"2026-09-29T17:00:00+02:00","slides":["What you learned today","Fold a zine","Eight pages (countdown 15)","The table (countdown 8, survey link on the screen)","Thanks"],"intro":[],"rows":[{"id":"b1630/r0","min":2,"label":"What you learned today, the four objectives","html":"What you learned today, the four objectives","sections":[]},{"id":"b1630/r1","min":3,"label":"Fold demo at the front, shown twice","html":"Fold demo at the front, shown twice","sections":["s0"]},{"id":"b1630/r2","min":15,"label":"Fill and decorate, music on","html":"Fill and decorate, music on","sections":["s1"]},{"id":"b1630/r3","min":8,"label":"Zines on the table, feedback; survey link on the screen","html":"Zines on the table, feedback; survey link on the screen","sections":["s2"]},{"id":"b1630/r4","min":2,"label":"Thanks, how to remove the skills","html":"Thanks, how to remove the skills","sections":["s3"]}],"sections":[{"id":"s0","title":"Fold a zine","min":3,"countdown":null,"tags":[],"content":[{"t":"ul","items":[{"html":"One A3 sheet per person. Fold in half the long way, open; fold in half the short way, then each half again, open: eight panels. One cut along the middle crease, two panels long. Push the ends together, fold into a booklet. Show it twice at the front, slowly; the slide has the steps as text.","text":"One A3 sheet per person. Fold in half the long way, open; fold in half the short way, then each half again, open: eight panels. One cut along the middle crease, two panels long. Push the ends together, fold into a booklet. Show it twice at the front, slowly; the slide has the steps as text.","childre
