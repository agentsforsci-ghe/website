meta:
  name: "Agents for Scientists (agentsforsci-ghe)"
  link: "https://agentsforsci-ghe.github.io/website/"

# Palette sourced from the Global Health Engineering group's own website
# (Global-Health-Engineering/website: theme.scss and slides/slides.scss),
# carried over from the gitforsci-ghe cohort site so the two workshops in
# the series look like one series.
color:
  palette:
    ghe-blue: "#0F4C81"
    ghe-orange: "#ED6D37"
    ghe-peach: "#FEBC94"
    ghe-yellow: "#FAE3B4"
    ghe-gray: "#5c5751"
    ghe-light: "#F5F5F5"
    ink: "#1e1e1e"
    paper: "#f4f4f4"
  foreground: ink
  background: paper
  primary: ghe-blue
  secondary: ghe-gray
  link: ghe-blue

# Typography mirrors the openwashdata brand (openwashdata/brand); the GHE
# brand will follow the same lines with its own colours.
typography:
  fonts:
    - family: Atkinson Hyperlegible Next
      source: google
      weight: [400, 600, 700]
      style: [normal, italic]
    - family: Source Code Pro
      source: google
      weight: [400, 500]
  base:
    family: Atkinson Hyperlegible Next
    line-height: 1.5
  headings:
    family: Atkinson Hyperlegible Next
    weight: 700
    color: primary
  monospace:
    family: Source Code Pro

logo:
  small: images/ghe-square-logo.png
