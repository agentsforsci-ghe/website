project:
  type: website
  output-dir: docs
  # Rebuilds glossary.yml from glossary.qmd and anchors every term there,
  # for the gl shortcode (_extensions/ghe/gl) that adds popover definitions.
  pre-render:
    - tools/build_glossary.py
  render:
    - "*.qmd"
    - "**/*.qmd"
  # Copied into docs/ on every render. GitHub Pages serves docs/ directly, and
  # this tells it not to run the output through Jekyll. Quarto clears docs/ on
  # render, so the file has to be a project resource rather than sit there.
  resources:
    - ".nojekyll"

website:
  page-navigation: true
  title: "Agents for Scientists (Autumn 2026)"
  description: "A hands-on workshop for the Global Health Engineering group
      at ETH Zurich. Researchers run the real work of publishing a paper
      under three conditions (without agents, with an agent given minimal
      input, and with an agent given a reviewed plan) so that the value and
      the limits of agentic AI in research become visible. Because the work
      runs through Git and GitHub, every agent action and human decision is
      recorded, which makes agent use traceable and declarable."
  site-url: "https://agentsforsci-ghe.github.io/website/"
  repo-url: https://github.com/agentsforsci-ghe/website
  repo-actions: [edit, issue]
  favicon: images/ghe-square-logo.png

  page-footer:
    left: |
      Funding and support: [Swiss Reproducibility Network (SwissRN)](https://www.swissrn.org/contents/community/nodes/) local node at ETH Zurich and the [Data Stewardship Network at ETH Zurich](https://library.ethz.ch/en/researching-and-publishing/data-management-and-policies/research-data-management/data-stewardship.html), funded by the [swissuniversities Open Science Programme](https://www.swissuniversities.ch/en/topics/open-science/open-science-programme), and the [Global Health Engineering group at ETH Zurich](https://ghe.ethz.ch/).
    right: "This page is built with [Quarto](https://quarto.org/)."
    background: "#F5F5F5"

  navbar:
    background: "#0F4C81"
    logo: "images/ghe-square-logo.png"
    logo-alt: "Global Health Engineering logo"
    title: "Agents for Scientists"
    search: true
    left:
      - href: index.qmd
        text: "Overview"
      - href: pre-work/index.qmd
        text: "Prepare"
      - href: background/index.qmd
        text: "Background"
    right:
      - icon: github
        href: https://github.com/agentsforsci-ghe
        aria-label: "GitHub organization"

  sidebar:
    - id: prepare
      title: "Prepare"
      style: "docked"
      background: "#F5F5F5"
      collapse-level: 1
      contents:
        - href: pre-work/index.qmd
          text: "Overview"
        - text: "---"
        - href: pre-work/01-create-repository.qmd
          text: "Step 1: Your repository"
        - href: pre-work/02-join-element.qmd
          text: "Step 2: Join the chat"
        - href: pre-work/03-survey.qmd
          text: "Step 3: Pre-course survey"
        - href: pre-work/04-install-claude-code.qmd
          text: "Step 4: Install Claude Code"
        - href: pre-work/05-github-cli.qmd
          text: "Step 5: Connect GitHub"
        - href: pre-work/06-connect-r.qmd
          text: "Step 6: Connect R"
        - href: pre-work/07-zotero.qmd
          text: "Step 7: Set up Zotero"
        - href: pre-work/08-zotero-mcp.qmd
          text: "Step 8: Connect Zotero"
        - href: pre-work/09-setup-check.qmd
          text: "Step 9: Test your setup"
    - id: background
      title: "Background"
      style: "docked"
      background: "#F5F5F5"
      collapse-level: 1
      contents:
        - href: background/index.qmd
          text: "Overview"
        - text: "---"
        - href: background/security.qmd
          text: "Security"
        - href: background/literacy.qmd
          text: "Literacy"
        - href: background/transparency.qmd
          text: "Transparency"
        - href: background/disclosure.qmd
          text: "Disclosure"
        - text: "---"
        - href: glossary.qmd
          text: "Glossary"
        - href: platform-guide.qmd
          text: "Which tool does what?"
        - href: references.qmd
          text: "References"

bibliography: references.bib
csl: https://www.zotero.org/styles/apa
link-citations: true

format:
  html:
    theme:
      light: [litera, theme.scss]
    grid:
      sidebar-width: 300px
      body-width: 900px
      margin-width: 250px
    link-external-icon: true
    link-external-newwindow: true
    code-copy: true
    code-overflow: wrap
    toc: true

freeze: auto
editor: source
